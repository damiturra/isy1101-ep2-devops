name: Backend CI/CD - Build, Push and Deploy

on:
  push:
    branches:
      - deploy
    paths:
      - "back-Despachos_SpringBoot/**"
      - "back-Ventas_SpringBoot/**"
      - ".github/workflows/backend.yml"

  workflow_dispatch:

jobs:
  build-and-push-backends:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y push Backend Despachos
        uses: docker/build-push-action@v6
        with:
          context: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          file: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/backend-despacho:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/backend-despacho:${{ github.sha }}

      - name: Build y push Backend Ventas
        uses: docker/build-push-action@v6
        with:
          context: ./back-Ventas_SpringBoot/Springboot-API-REST
          file: ./back-Ventas_SpringBoot/Springboot-API-REST/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/backend-ventas:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/backend-ventas:${{ github.sha }}

  deploy-backends-ec2:
    runs-on: ubuntu-latest
    needs: build-and-push-backends
    timeout-minutes: 15

    steps:
      - name: Preparar llave SSH para Frontend Bastion
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem

      - name: Copiar llave al Frontend Bastion
        run: |
          scp \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o IdentitiesOnly=yes \
            -i ~/.ssh/ec2_key.pem \
            ~/.ssh/ec2_key.pem \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_FRONT_HOST }}:~/.ssh/backend_key.pem

      - name: Deploy en EC2 Backend privada via Frontend Bastion
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -i ~/.ssh/ec2_key.pem \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_FRONT_HOST }} << 'FRONTEND'
          set -e

          chmod 400 ~/.ssh/backend_key.pem

          ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -i ~/.ssh/backend_key.pem \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_BACK_PRIVATE_IP }} << 'BACKEND'
          set -e

          mkdir -p ~/devops-backend
          cd ~/devops-backend

          cat > init-multiple-dbs.sql << 'SQL'
          CREATE DATABASE IF NOT EXISTS despacho_db;
          CREATE DATABASE IF NOT EXISTS ventas_db;

          CREATE USER IF NOT EXISTS 'appuser'@'%' IDENTIFIED BY 'apppass123';

          GRANT ALL PRIVILEGES ON despacho_db.* TO 'appuser'@'%';
          GRANT ALL PRIVILEGES ON ventas_db.* TO 'appuser'@'%';

          FLUSH PRIVILEGES;
          SQL

          cat > docker-compose.yml << 'COMPOSE'
          services:
            mysql_db:
              image: mysql:8.0
              container_name: mysql_db
              restart: unless-stopped
              environment:
                MYSQL_ROOT_PASSWORD: rootpass123
              volumes:
                - mysql_data:/var/lib/mysql
                - ./init-multiple-dbs.sql:/docker-entrypoint-initdb.d/init-multiple-dbs.sql:ro
              networks:
                - backend_net
              healthcheck:
                test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -prootpass123 || exit 1"]
                interval: 10s
                timeout: 10s
                retries: 30
                start_period: 90s

            backend_despacho:
              image: dvillanueva1993/backend-despacho:latest
              container_name: backend_despacho
              restart: unless-stopped
              depends_on:
                mysql_db:
                  condition: service_healthy
              ports:
                - "8080:8080"
              environment:
                SERVER_PORT: 8080
                DB_ENDPOINT: mysql_db
                DB_PORT: 3306
                DB_NAME: despacho_db
                DB_USERNAME: appuser
                DB_PASSWORD: apppass123
                SPRING_JPA_HIBERNATE_DDL_AUTO: update
              networks:
                - backend_net

            backend_ventas:
              image: dvillanueva1993/backend-ventas:latest
              container_name: backend_ventas
              restart: unless-stopped
              depends_on:
                mysql_db:
                  condition: service_healthy
              ports:
                - "8082:8082"
              environment:
                SERVER_PORT: 8082
                SPRING_DATASOURCE_URL: jdbc:mysql://mysql_db:3306/ventas_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
                SPRING_DATASOURCE_USERNAME: appuser
                SPRING_DATASOURCE_PASSWORD: apppass123
                SPRING_JPA_HIBERNATE_DDL_AUTO: update
              networks:
                - backend_net

          volumes:
            mysql_data:

          networks:
            backend_net:
              driver: bridge
          COMPOSE

          echo "${{ secrets.DOCKERHUB_TOKEN }}" | sudo docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

          if ! sudo docker compose version >/dev/null 2>&1; then
            echo "Docker Compose plugin no encontrado. Instalando Docker Compose..."

            sudo mkdir -p /usr/local/lib/docker/cli-plugins

            ARCH=$(uname -m)

            if [ "$ARCH" = "x86_64" ]; then
              COMPOSE_ARCH="x86_64"
            elif [ "$ARCH" = "aarch64" ]; then
              COMPOSE_ARCH="aarch64"
            else
              echo "Arquitectura no soportada: $ARCH"
              exit 1
            fi

            sudo curl -SL "https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-${COMPOSE_ARCH}" -o /usr/local/lib/docker/cli-plugins/docker-compose
            sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
          fi

          sudo docker compose version

          echo "Limpiando contenedores antiguos si existen..."
          sudo docker rm -f mysql_despacho mysql_ventas mysql_db backend_despacho backend_ventas || true

          echo "Descargando imagenes..."
          sudo docker compose pull

          echo "Levantando MySQL..."
          sudo docker compose up -d mysql_db

          echo "Esperando MySQL..."
          for i in {1..30}; do
            if sudo docker exec mysql_db mysqladmin ping -h 127.0.0.1 -uroot -prootpass123 --silent; then
              echo "MySQL esta listo"
              break
            fi

            echo "MySQL aun no esta listo. Intento $i/30"
            sleep 5
          done

          echo "Asegurando bases de datos y usuario..."
          sudo docker exec mysql_db mysql -uroot -prootpass123 -e "
          CREATE DATABASE IF NOT EXISTS despacho_db;
          CREATE DATABASE IF NOT EXISTS ventas_db;
          CREATE USER IF NOT EXISTS 'appuser'@'%' IDENTIFIED BY 'apppass123';
          GRANT ALL PRIVILEGES ON despacho_db.* TO 'appuser'@'%';
          GRANT ALL PRIVILEGES ON ventas_db.* TO 'appuser'@'%';
          FLUSH PRIVILEGES;
          "

          echo "Levantando backends..."
          sudo docker compose up -d --remove-orphans backend_despacho backend_ventas || {
            echo "Error al levantar backends"
            sudo docker compose ps || true
            sudo docker logs mysql_db --tail=150 || true
            sudo docker logs backend_despacho --tail=120 || true
            sudo docker logs backend_ventas --tail=120 || true
            exit 1
          }

          echo "Estado final de contenedores:"
          sudo docker compose ps

          echo "Logs MySQL:"
          sudo docker logs mysql_db --tail=80 || true

          echo "Logs Backend Despacho:"
          sudo docker logs backend_despacho --tail=100 || true

          echo "Logs Backend Ventas:"
          sudo docker logs backend_ventas --tail=100 || true

          echo "Deploy backend finalizado correctamente"
          BACKEND

          FRONTEND
