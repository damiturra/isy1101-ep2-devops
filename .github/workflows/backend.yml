name: Backend CI/CD - Build, Push and Deploy

on:
  push:
    branches:
      - deploy
    paths:
      - "back-Despachos_SpringBoot/**"
      - "back-Ventas_SpringBoot/**"
      - ".github/workflows/backend.yml"

  workflow_dispatch:

jobs:
  build-and-push-backends:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y push Backend Despachos
        uses: docker/build-push-action@v6
        with:
          context: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          file: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/backend-despacho:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/backend-despacho:${{ github.sha }}

      - name: Build y push Backend Ventas
        uses: docker/build-push-action@v6
        with:
          context: ./back-Ventas_SpringBoot/Springboot-API-REST
          file: ./back-Ventas_SpringBoot/Springboot-API-REST/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/backend-ventas:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/backend-ventas:${{ github.sha }}

  deploy-backends-ec2:
    runs-on: ubuntu-latest
    needs: build-and-push-backends

    steps:
      - name: Preparar llave SSH y configuracion de hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem

          cat > ~/.ssh/config <<CONFIG
          Host bastion
            HostName ${{ secrets.EC2_FRONT_HOST }}
            User ${{ secrets.EC2_USER }}
            IdentityFile ~/.ssh/ec2_key.pem
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            LogLevel ERROR

          Host backend-private
            HostName ${{ secrets.EC2_BACK_PRIVATE_IP }}
            User ${{ secrets.EC2_USER }}
            IdentityFile ~/.ssh/ec2_key.pem
            ProxyJump bastion
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            LogLevel ERROR
          CONFIG

          chmod 600 ~/.ssh/config

      - name: Deploy en EC2 Backend privada via Frontend Bastion
        run: |
          ssh backend-private << 'EOF'
          set -e

          mkdir -p ~/devops-backend
          cd ~/devops-backend

          cat > docker-compose.yml << 'COMPOSE'
          services:
            mysql_despacho:
              image: mysql:8.0
              container_name: mysql_despacho
              restart: unless-stopped
              environment:
                MYSQL_DATABASE: despacho_db
                MYSQL_USER: appuser
                MYSQL_PASSWORD: apppass123
                MYSQL_ROOT_PASSWORD: rootpass123
              volumes:
                - mysql_despacho_data:/var/lib/mysql
              networks:
                - backend_net
              healthcheck:
                test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -prootpass123 || exit 1"]
                interval: 10s
                timeout: 5s
                retries: 10
                start_period: 90s

            backend_despacho:
              image: dvillanueva1993/backend-despacho:latest
              container_name: backend_despacho
              restart: unless-stopped
              depends_on:
                mysql_despacho:
                  condition: service_healthy
              ports:
                - "8080:8080"
              environment:
                SERVER_PORT: 8080
                DB_ENDPOINT: mysql_despacho
                DB_PORT: 3306
                DB_NAME: despacho_db
                DB_USERNAME: appuser
                DB_PASSWORD: apppass123
                SPRING_JPA_HIBERNATE_DDL_AUTO: update
              networks:
                - backend_net

            mysql_ventas:
              image: mysql:8.0
              container_name: mysql_ventas
              restart: unless-stopped
              environment:
                MYSQL_DATABASE: ventas_db
                MYSQL_USER: appuser
                MYSQL_PASSWORD: apppass123
                MYSQL_ROOT_PASSWORD: rootpass123
              volumes:
                - mysql_ventas_data:/var/lib/mysql
              networks:
                - backend_net
              healthcheck:
                test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass123"]
                interval: 10s
                timeout: 5s
                retries: 10

            backend_ventas:
              image: dvillanueva1993/backend-ventas:latest
              container_name: backend_ventas
              restart: unless-stopped
              depends_on:
                mysql_ventas:
                  condition: service_healthy
              ports:
                - "8082:8082"
              environment:
                SERVER_PORT: 8082
                SPRING_DATASOURCE_URL: jdbc:mysql://mysql_ventas:3306/ventas_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
                SPRING_DATASOURCE_USERNAME: appuser
                SPRING_DATASOURCE_PASSWORD: apppass123
                SPRING_JPA_HIBERNATE_DDL_AUTO: update
              networks:
                - backend_net

          volumes:
            mysql_despacho_data:
            mysql_ventas_data:

          networks:
            backend_net:
              driver: bridge
          COMPOSE

          echo "${{ secrets.DOCKERHUB_TOKEN }}" | sudo docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

          if ! sudo docker compose version >/dev/null 2>&1; then
            echo "Docker Compose plugin no encontrado. Instalando Docker Compose..."

            sudo mkdir -p /usr/local/lib/docker/cli-plugins

            ARCH=$(uname -m)

            if [ "$ARCH" = "x86_64" ]; then
              COMPOSE_ARCH="x86_64"
            elif [ "$ARCH" = "aarch64" ]; then
              COMPOSE_ARCH="aarch64"
            else
              echo "Arquitectura no soportada: $ARCH"
              exit 1
            fi

            sudo curl -SL "https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-${COMPOSE_ARCH}" -o /usr/local/lib/docker/cli-plugins/docker-compose
            sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
          fi

          sudo docker compose version
          sudo docker compose pull
          sudo docker compose up -d --remove-orphans
          sudo docker logs mysql_despacho || true
          sudo docker compose ps
          EOF
