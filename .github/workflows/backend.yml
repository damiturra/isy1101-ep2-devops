name: Backend CI/CD

on:
  push:
    branches: [ deploy ]
    paths: [ 'back-*/**', '.github/workflows/backend.yml' ]
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Backend Ventas
        uses: docker/build-push-action@v6
        with:
          context: ./back-Ventas_SpringBoot/Springboot-API-REST
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/backend-ventas:latest
      - name: Build and push Backend Despachos
        uses: docker/build-push-action@v6
        with:
          context: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/backend-despacho:latest
      - name: Deploy to EC2 Backend (via Frontend Bastion)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_FRONT_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            ssh -o StrictHostKeyChecking=no -i ~/.ssh/backend_key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_BACK_PRIVATE_IP }} << EOF
              sudo docker rm -f backend_ventas backend_despacho mysql_db 2>/dev/null || true
              sudo docker volume create mysql_data || true
              sudo docker network create app_net 2>/dev/null || true
              sudo docker run -d --name mysql_db --network app_net --restart unless-stopped -v mysql_data:/var/lib/mysql -e MYSQL_ROOT_PASSWORD=nopassword -e MYSQL_DATABASE=proyecto_db mysql:8.0 --innodb-buffer-pool-size=64M
              sleep 20
              sudo docker run -d --name backend_ventas --network app_net --restart unless-stopped -p 8082:8082 -e JAVA_TOOL_OPTIONS="-Xms64m -Xmx192m" -e SERVER_PORT=8082 -e DB_ENDPOINT=mysql_db -e DB_PORT=3306 -e DB_NAME=proyecto_db -e DB_USERNAME=root -e DB_PASSWORD=nopassword ${{ secrets.DOCKERHUB_USERNAME }}/backend-ventas:latest
              sudo docker run -d --name backend_despacho --network app_net --restart unless-stopped -p 8080:8080 -e JAVA_TOOL_OPTIONS="-Xms64m -Xmx192m" -e SERVER_PORT=8080 -e DB_ENDPOINT=mysql_db -e DB_PORT=3306 -e DB_NAME=proyecto_db -e DB_USERNAME=root -e DB_PASSWORD=nopassword ${{ secrets.DOCKERHUB_USERNAME }}/backend-despacho:latest
            EOF
