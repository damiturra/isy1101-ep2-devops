name: Frontend CI/CD - Build and Push

on:
  push:
    branches:
      - deploy
    paths:
      - "front_despacho/**"
      - ".github/workflows/frontend.yml"

  workflow_dispatch:

jobs:
  build-and-push-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./front_despacho
          file: ./front_despacho/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend-despacho:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend-despacho:${{ github.sha }}
