services:
  db_ventas:
    image: mysql:8.0
    container_name: mysql_ventas
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ventas_db
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass123
      MYSQL_ROOT_PASSWORD: rootpass123
    volumes:
      - mysql_ventas_data:/var/lib/mysql
    networks:
      - ventas_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass123"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend_ventas:
    build: .
    image: backend-ventas:local
    container_name: backend_ventas
    restart: unless-stopped
    depends_on:
      db_ventas:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:mysql://db_ventas:3306/ventas_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: appuser
      SPRING_DATASOURCE_PASSWORD: apppass123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    networks:
      - ventas_net

volumes:
  mysql_ventas_data:

networks:
  ventas_net:
    driver: bridge